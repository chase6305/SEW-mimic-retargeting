name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e '.[dev,visualization,safety]'
      - name: Check formatting
        run: |
          ruff format --check src examples benchmarks scripts tests setup.py
          mdformat --check README.md
      - name: Lint
        run: ruff check src examples benchmarks scripts tests setup.py
      - name: Test
        run: pytest
      - name: Build wheel with bundled robot assets
        run: python -m build --wheel
      - name: Verify wheel package and robot assets
        run: python scripts/verify_wheel.py dist/*.whl --assets assets --expect-pure
      - name: Smoke-test pure wheel in isolation
        run: |
          python -m venv /tmp/sew-pure-wheel
          /tmp/sew-pure-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/sew-pure-wheel/bin/python "$GITHUB_WORKSPACE/scripts/smoke_test_install.py"

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install native development environment
        run: python -m pip install -e '.[dev,cpp-dev,visualization,safety]'
        env:
          SEW_MIMIC_BUILD_CPP: "1"
      - name: Verify native extension identity
        run: python -c "from sew_mimic import backend_status; assert backend_status()['cpp_implementation'] == 'native'"
      - name: Check C++ formatting
        run: clang-format --dry-run --Werror src/cpp/sew_mimic_cpp.cpp
      - name: Run Python/C++ parity and integration tests
        run: pytest
      - name: Build native wheel
        run: python -m build --wheel
        env:
          SEW_MIMIC_BUILD_CPP: "1"
      - name: Verify native wheel package and robot assets
        run: python scripts/verify_wheel.py dist/*.whl --assets assets --expect-native
      - name: Verify native wheel in isolation
        run: |
          python -m venv /tmp/sew-native-wheel
          /tmp/sew-native-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/sew-native-wheel/bin/python "$GITHUB_WORKSPACE/scripts/smoke_test_install.py" --expect-native
