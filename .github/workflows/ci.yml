name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e '.[dev,visualization,safety]'
      - name: Check formatting
        run: ruff format --check src examples tests
      - name: Lint
        run: ruff check src examples tests
      - name: Test
        run: pytest
      - name: Build wheel with bundled Marvin assets
        run: python -m build --wheel
