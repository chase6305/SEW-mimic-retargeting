[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sew-mimic-retargeting"
version = "0.1.0"
description = "NumPy reproduction of the core SEW-Mimic geometric retargeting solver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/chase6305/SEW-mimic-retargeting"

[project.optional-dependencies]
test = ["pytest>=7"]
visualization = ["viser>=1.0,<2", "yourdfpy>=0.0.58"]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["assets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
