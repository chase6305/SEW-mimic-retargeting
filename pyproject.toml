[build-system]
requires = ["setuptools>=61", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "sew-mimic-retargeting"
version = "0.1.0"
description = "NumPy reproduction of the core SEW-Mimic geometric retargeting solver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/chase6305/SEW-mimic-retargeting"

[project.optional-dependencies]
test = ["pytest>=7"]
visualization = ["viser>=1.0,<2", "yourdfpy>=0.0.58"]
safety = ["trimesh>=4.0"]
dev = [
    "build>=1",
    "mdformat>=0.7,<1",
    "mdformat-gfm>=0.3,<1",
    "pytest>=7",
    "ruff>=0.6",
]
cpp = ["pybind11>=2.11"]
cpp-dev = ["clang-format==18.1.8", "pybind11>=2.11"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/sew-mimic-retargeting/assets/Marvin_M6_S_CCS_696_V4.0" = [
    "assets/Marvin_M6_S_CCS_696_V4.0/*.urdf",
]
"share/sew-mimic-retargeting/assets/Marvin_M6_S_CCS_696_V4.0/collision" = [
    "assets/Marvin_M6_S_CCS_696_V4.0/collision/*.obj",
]
"share/sew-mimic-retargeting/assets/Marvin_M6_S_CCS_696_V4.0/visual/glb" = [
    "assets/Marvin_M6_S_CCS_696_V4.0/visual/glb/*.glb",
]
"share/sew-mimic-retargeting/assets/Marvin_M6_S_CCS_696_V4.0/visual/stl" = [
    "assets/Marvin_M6_S_CCS_696_V4.0/visual/stl/*.stl",
]
"share/sew-mimic-retargeting/assets/OpenArm" = ["assets/OpenArm/*.urdf"]
"share/sew-mimic-retargeting/assets/OpenArm/collision/torso" = ["assets/OpenArm/collision/torso/*.stl"]
"share/sew-mimic-retargeting/assets/OpenArm/collision/left_arm" = ["assets/OpenArm/collision/left_arm/*.stl"]
"share/sew-mimic-retargeting/assets/OpenArm/collision/right_arm" = ["assets/OpenArm/collision/right_arm/*.stl"]
"share/sew-mimic-retargeting/assets/OpenArm/collision/hand" = ["assets/OpenArm/collision/hand/*.stl"]
"share/sew-mimic-retargeting/assets/OpenArm/visual/torso" = ["assets/OpenArm/visual/torso/*.glb"]
"share/sew-mimic-retargeting/assets/OpenArm/visual/left_arm" = ["assets/OpenArm/visual/left_arm/*.glb"]
"share/sew-mimic-retargeting/assets/OpenArm/visual/right_arm" = ["assets/OpenArm/visual/right_arm/*.glb"]
"share/sew-mimic-retargeting/assets/OpenArm/visual/hand" = ["assets/OpenArm/visual/hand/*.glb"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["assets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mdformat]
wrap = 100
